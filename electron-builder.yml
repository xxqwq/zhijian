appId: com.zhijian.markdown
productName: 纸间
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - nsis
  artifactName: zhijian-setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 纸间
mac:
  category: public.app-category.productivity
  artifactName: zhijian-${version}-mac.${ext}
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
linux:
  category: Office
  executableName: zhijian
  artifactName: zhijian-${version}.${ext}
  target:
    - AppImage
publish:
  provider: github
  owner: xxqwq
  repo: zhijian
